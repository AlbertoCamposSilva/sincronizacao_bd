[project]
name = "sincronizador"
version = "0.1.0"
description = "Sincronização bidirecional assíncrona dos bancos PostgreSQL (casa <-> CNPq) via pasta do Google Drive"
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary>=2.9",
    "cryptography>=42",
    "acs-toolbox[gcp]",
]

[project.optional-dependencies]
avisos = ["windows-toasts>=1.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"
